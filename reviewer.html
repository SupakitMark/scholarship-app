<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviewer Queue - ระบบตรวจประเมินทุน</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-gray-800 font-sans min-h-screen">

  <nav class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center px-8">
    <h1 class="text-xl font-bold">📋 Reviewer Dashboard - คิวตรวจประเมินทุน</h1>
    <div class="flex items-center space-x-4">
      <a href="index.html" class="text-indigo-200 hover:text-white text-sm">← หน้าหลัก</a>
      <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded-lg">ออกจากระบบ</button>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto p-6 space-y-6">

    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex justify-between items-center">
      <div>
        <h2 class="text-lg font-bold text-gray-800">รายการใบสมัครที่รอการตรวจสอบ</h2>
        <p class="text-xs text-gray-500">ตรวจสอบความถูกต้องของเอกสารแนบและคุณสมบัติผู้สมัคร</p>
      </div>
      <button onclick="loadReviewerQueue()" class="bg-indigo-50 text-indigo-700 border border-indigo-200 font-semibold px-4 py-2 rounded-lg text-xs hover:bg-indigo-100">
        🔄 รีเฟรชข้อมูล
      </button>
    </div>

    <!-- รายการตารางใบสมัคร -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <table class="w-full text-left text-sm">
        <thead class="bg-indigo-50 border-b text-indigo-900 font-bold">
          <tr>
            <th class="p-3">ผู้สมัคร</th>
            <th class="p-3">ทุนการศึกษา</th>
            <th class="p-3">GPA</th>
            <th class="p-3">เอกสารแนบ</th>
            <th class="p-3">สถานะ</th>
            <th class="p-3 text-center">จัดการ</th>
          </tr>
        </thead>
        <tbody id="reviewer-table-body">
          <tr>
            <td colspan="6" class="p-4 text-center text-gray-400">กำลังโหลดรายการ...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- โหลดสคริปต์เรียงตามลำดับ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await requireRole(['reviewer', 'admin']);
      loadReviewerQueue();
    });

    async function loadReviewerQueue() {
      const tbody = document.getElementById('reviewer-table-body');

      const { data: list, error } = await supabase
        .from('saved_scholarships')
        .select(`
          id,
          saved_at,
          user_id,
          scholarships ( id, title, amount ),
          student_profiles!inner ( full_name, faculty, major, gpa ),
          checklist_items (
            id,
            completed,
            updated_at,
            scholarship_requirements ( document_name )
          )
        `)
        .order('saved_at', { ascending: false });

      if (error || !list || list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400">ไม่มีใบสมัครรอการตรวจสอบ</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(item => `
        <tr class="border-b hover:bg-slate-50 transition">
          <td class="p-3">
            <div class="font-bold text-gray-900">${item.student_profiles?.full_name}</div>
            <div class="text-xs text-gray-500">${item.student_profiles?.faculty} (${item.student_profiles?.major})</div>
          </td>
          <td class="p-3 font-semibold text-indigo-950">${item.scholarships?.title}</td>
          <td class="p-3 font-bold text-emerald-700">${item.student_profiles?.gpa}</td>
          <td class="p-3 text-xs space-y-1">
            ${(item.checklist_items || []).map(check => `
              <div class="flex items-center space-x-1">
                <span class="${check.completed ? 'text-emerald-600 font-bold' : 'text-gray-400'}">
                  ${check.completed ? '✓' : '✗'}
                </span>
                <span>${check.scholarship_requirements?.document_name}</span>
              </div>
            `).join('') || '<span class="text-gray-400">ไม่มีเอกสาร</span>'}
          </td>
          <td class="p-3">
            <span class="px-2 py-1 text-xs rounded-full font-bold bg-amber-100 text-amber-800">
              PENDING
            </span>
          </td>
          <td class="p-3 text-center space-x-1">
            <button onclick="updateDecision('${item.id}', 'APPROVED')" 
              class="bg-emerald-600 text-white hover:bg-emerald-700 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm">
              อนุมัติ (APPROVED)
            </button>
            <button onclick="updateDecision('${item.id}', 'REJECTED')" 
              class="bg-red-600 text-white hover:bg-red-700 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm">
              ปฏิเสธ (REJECTED)
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function updateDecision(savedId, decisionStatus) {
      if (!confirm(`ยืนยันการทำรายการ: ${decisionStatus}?`)) return;

      alert(`อัปเดตสถานะใบสมัครเป็น ${decisionStatus} เรียบร้อยแล้ว`);
      loadReviewerQueue();
    }
  </script>
</body>
</html>
