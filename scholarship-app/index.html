<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholarship Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-gray-800 font-sans min-h-screen">

  <nav class="bg-emerald-700 text-white p-4 shadow-md flex justify-between items-center px-8">
    <h1 class="text-xl font-bold">🎓 Scholarship Management System</h1>
    <div class="flex items-center space-x-3">
      <a href="reviewer.html" class="bg-emerald-800 px-3 py-1.5 rounded-lg text-xs hover:bg-emerald-900 font-semibold transition">
        📋 ตรวจประเมิน (Reviewer)
      </a>
      <a href="admin.html" class="bg-emerald-900 px-3 py-1.5 rounded-lg text-xs hover:bg-emerald-950 font-semibold transition">
        ⚙️ แผงควบคุม Admin (CRUD)
      </a>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- รายการทุน -->
    <div class="md:col-span-2 space-y-4">
      <!-- ข้อมูลผู้ใช้งาน -->
      <div id="profile-info"></div>

      <h2 class="text-xl font-bold text-gray-800">ทุนการศึกษาที่เปิดรับสมัคร</h2>
      <div id="scholarship-list" class="space-y-4">
        <p class="text-gray-400 text-sm">กำลังโหลดข้อมูลทุน...</p>
      </div>
    </div>

    <!-- Sidebar ทุนที่บันทึกไว้ & Checklist -->
    <div>
      <h2 class="text-xl font-bold text-gray-800 mb-4">📌 ทุนที่บันทึกไว้ & Checklist</h2>
      <div id="saved-list" class="space-y-3">
        <p class="text-gray-400 text-sm">กำลังโหลด...</p>
      </div>
    </div>

  </div>

  <!-- โหลดสคริปต์เรียงตามลำดับ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetchScholarships();
      fetchSavedScholarships();
    });
  </script>
</body>
</html>
