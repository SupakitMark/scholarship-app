<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Manage Scholarships</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-gray-800 font-sans min-h-screen">

  <nav class="bg-slate-800 text-white p-4 shadow-md flex justify-between items-center px-8">
    <h1 class="text-xl font-bold">⚙️ Admin Dashboard - ทุนการศึกษา</h1>
    <a href="index.html" class="text-slate-300 hover:text-white text-sm">← กลับหน้าหลัก</a>
  </nav>

  <div class="max-w-4xl mx-auto p-6 space-y-6">

    <!-- ฟอร์มเพิ่มทุน -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <h2 class="text-lg font-bold mb-4 text-slate-800">เพิ่มทุนการศึกษาใหม่ (POST API)</h2>
      <form id="admin-form" onsubmit="createScholarship(event)" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold mb-1">ชื่อทุนการศึกษา</label>
            <input type="text" id="add-title" required class="w-full border rounded-lg p-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">ผู้จัดสรร/องค์กร</label>
            <input type="text" id="add-provider" required class="w-full border rounded-lg p-2 text-sm">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">รายละเอียด</label>
          <textarea id="add-desc" rows="2" class="w-full border rounded-lg p-2 text-sm"></textarea>
        </div>
        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold mb-1">จำนวนเงิน (บาท)</label>
            <input type="number" id="add-amount" required class="w-full border rounded-lg p-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">วันปิดรับสมัคร</label>
            <input type="date" id="add-deadline" required class="w-full border rounded-lg p-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">สถานะ</label>
            <select id="add-status" class="w-full border rounded-lg p-2 text-sm">
              <option value="Open">Open</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
        </div>
        <button type="submit" class="bg-emerald-600 text-white font-bold px-5 py-2 rounded-lg text-sm hover:bg-emerald-700">
          บันทึกทุนใหม่
        </button>
      </form>
    </div>

    <!-- รายการทุนทั้งหมด (PATCH / DELETE) -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-100 border-b">
          <tr>
            <th class="p-3">ชื่อทุน</th>
            <th class="p-3">ผู้จัดสรร</th>
            <th class="p-3">จำนวนเงิน</th>
            <th class="p-3">สถานะ</th>
            <th class="p-3 text-center">จัดการ</th>
          </tr>
        </thead>
        <tbody id="admin-table"></tbody>
      </table>
    </div>

  </div>

  <!-- โหลดสคริปต์เรียงตามลำดับ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function loadAdminTable() {
      // ตรวจสอบสิทธิ์สิทธิ์ Admin ก่อนดึงข้อมูล
      await requireRole(['admin']);

      const { data } = await supabase.from('scholarships').select('*').order('created_at', {ascending: false});
      const tbody = document.getElementById('admin-table');
      if (!tbody) return;

      tbody.innerHTML = (data || []).map(item => `
        <tr class="border-b">
          <td class="p-3 font-semibold">${item.title}</td>
          <td class="p-3">${item.provider}</td>
          <td class="p-3">฿${Number(item.amount).toLocaleString()}</td>
          <td class="p-3">
            <span class="px-2 py-0.5 text-xs rounded ${item.status.toLowerCase() === 'open' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
              ${item.status}
            </span>
          </td>
          <td class="p-3 text-center space-x-2">
            <button onclick="toggleStatus('${item.id}', '${item.status}')" class="text-blue-600 hover:underline">เปลี่ยนสถานะ (PATCH)</button>
            <button onclick="deleteScholarship('${item.id}')" class="text-red-600 hover:underline">ลบ (DELETE)</button>
          </td>
        </tr>
      `).join('');
    }

    async function createScholarship(e) {
      e.preventDefault();
      await supabase.from('scholarships').insert([{
        title: document.getElementById('add-title').value,
        provider: document.getElementById('add-provider').value,
        description: document.getElementById('add-desc').value,
        amount: parseFloat(document.getElementById('add-amount').value),
        deadline: document.getElementById('add-deadline').value,
        status: document.getElementById('add-status').value
      }]);
      alert('เพิ่มทุนสำเร็จ!');
      document.getElementById('admin-form').reset();
      loadAdminTable();
    }

    async function toggleStatus(id, currentStatus) {
      const newStatus = currentStatus === 'Open' ? 'Closed' : 'Open';
      await supabase.from('scholarships').update({ status: newStatus }).eq('id', id);
      loadAdminTable();
    }

    async function deleteScholarship(id) {
      if (confirm('ยืนยันการลบทุนนี้?')) {
        await supabase.from('scholarships').delete().eq('id', id);
        loadAdminTable();
      }
    }

    document.addEventListener('DOMContentLoaded', loadAdminTable);
  </script>
</body>
</html>
